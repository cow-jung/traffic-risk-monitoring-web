<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 | 위기탈출 넘버 포</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <div class="brand">위기탈출 넘버 포</div>
    <nav>
      <a href="../index.html">홈</a>
      <a href="about.html">개요</a>
      <a href="control.html">관제 화면</a>
      <a href="notice.html">공지사항</a>
      <a href="board.html">게시판</a>
      <a href="login.html">로그인</a>
    </nav>
  </header>

  <main>

    <section id="notice-list">
      <h1>공지사항</h1>

      <div class="list-toolbar">
        <!-- 관리자 전용 -->
        <button type="button" id="notice-write-btn" class="btn btn-small" data-admin-only>공지 작성</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일</th>
          </tr>
        </thead>
        <tbody id="notice-table-body"></tbody>
      </table>
    </section>

    <!-- 공지 상세 -->
    <section id="notice-detail">
      <h2 id="notice-detail-title"></h2>
      <span class="meta" id="notice-detail-meta"></span>
      <p id="notice-detail-content"></p>

      <div class="detail-actions">
        <!-- 관리자 전용 -->
        <button type="button" id="notice-edit-btn" class="btn btn-small" data-admin-only>수정</button>
        <button type="button" id="notice-delete-btn" class="btn btn-small btn-danger" data-admin-only>삭제</button>
      </div>
    </section>

  </main>

  <button id="chat-fab" type="button" aria-expanded="false" aria-controls="chat-panel"><span class="sr-only">도움말 챗봇 열기</span></button>
  <div id="chat-panel" role="dialog" aria-label="도움말 챗봇"></div>

  <footer>
    <p>© 2026 4ositive · AI-X 스마트 교통 및 인프라 유지관리 아카데미 미니프로젝트</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
