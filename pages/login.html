<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 위기탈출 넘버 포</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <div class="brand">위기탈출 넘버 포</div>
    <nav>
      <a href="../index.html">홈</a>
      <a href="about.html">개요</a>
      <a href="control.html">관제 화면</a>
      <a href="notice.html">공지사항</a>
      <a href="board.html">게시판</a>
      <a href="login.html">로그인</a>
    </nav>
  </header>

  <main>

    <section id="login-form">
      <h1>로그인</h1>

      <div id="role-toggle">
        <button type="button" id="role-user" class="active">일반 사용자</button>
        <button type="button" id="role-admin">관리자</button>
      </div>

      <form>
        <div>
          <label for="username">아이디</label>
          <input type="text" id="username" autocomplete="username">
        </div>

        <div>
          <label for="password">비밀번호</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>

        <button type="submit">로그인</button>
      </form>
      <p class="login-note">데모 화면입니다. 아이디·비밀번호는 아무 값이나 입력해도 선택한 권한으로 로그인됩니다.</p>
    </section>

  </main>

  <footer>
    <p>© 2026 4ositive · AI-X 스마트 교통 및 인프라 유지관리 아카데미 미니프로젝트</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
