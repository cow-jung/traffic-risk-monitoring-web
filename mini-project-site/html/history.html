<!DOCTYPE html>
<html lang="ko">
<head>
  <script>try { if (localStorage.getItem('mini-project-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (error) {}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>탐지 기록 | 위기탈출 넘버 포</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/control-dashboard.css">
  <link rel="stylesheet" href="/static/css/history.css">
</head>
<body>
<header><div class="brand">위기탈출 넘버 포</div><nav aria-label="주 메뉴"><a href="/">홈</a><a href="/about">개요</a><a href="/control">대시보드</a></nav></header>
<main id="history-page">
  <div class="history-heading">
    <div><p class="eyebrow">DETECTION HISTORY</p><h1>전체 탐지 기록</h1><p>저장된 AI 이상상황 기록을 날짜·카메라·유형·검색어로 조회할 수 있습니다.</p></div>
    <div class="history-actions"><a class="btn" href="/control">← 대시보드</a><button class="btn btn-primary" id="download-csv" type="button">CSV 다운로드</button></div>
  </div>
  <section class="history-search-card">
    <div class="history-filters">
      <label>시작일<input id="date-from" type="date"></label>
      <label>종료일<input id="date-to" type="date"></label>
      <label>카메라<select id="history-camera"><option value="all">전체</option><option value="cam1">CAM 01</option><option value="cam2">CAM 02</option></select></label>
      <label>유형<select id="history-type"><option value="all">전체</option><option value="주정차">주정차</option><option value="역주행">역주행</option><option value="사고">사고 및 위험</option><option value="위험 상황">위험 상황</option></select></label>
      <label class="keyword-label">검색<input id="history-keyword" type="search" placeholder="메시지, 유형, 카메라 검색"></label>
    </div>
    <div class="filter-actions"><button class="btn btn-primary" id="search-history" type="button">검색</button><button class="btn" id="reset-history" type="button">초기화</button><span id="history-count">불러오는 중…</span></div>
  </section>
  <section class="history-table-card">
    <div class="history-table-wrap">
      <table class="history-table"><thead><tr><th>발생 일시</th><th>카메라</th><th>유형</th><th>신뢰도</th><th>탐지 내용</th><th>자료</th></tr></thead><tbody id="history-body"><tr><td colspan="6">기록을 불러오는 중…</td></tr></tbody></table>
    </div>
    <div class="history-pagination"><button class="btn" id="prev-page" type="button">이전</button><span id="page-info">1 / 1</span><button class="btn" id="next-page" type="button">다음</button></div>
  </section>
</main>
<button id="theme-toggle" type="button" aria-label="밝은 모드로 전환" aria-pressed="false" title="밝은 모드로 전환">☀</button>
<footer><p>© 2026 4ositive · AI-X 스마트 교통 및 인프라 유지관리 아카데미 미니프로젝트</p></footer>
<script src="/static/js/site.js"></script>
<script src="/static/js/history.js"></script>
</body></html>
